<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College ERP Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow-lg text-center p-5" style="max-width: 600px; width: 100%; border-radius: 15px;">
        <h1 class="display-5 text-primary mb-3">🏫 College ERP System</h1>
        <p class="text-muted mb-4">Welcome! Please select your designated portal to log in.</p>
        <hr class="my-4">
        
        <div class="d-grid gap-3">
            <a href="/login/admin" class="btn btn-outline-danger btn-lg shadow-sm">🔑 Admin Login Portal</a>
            <a href="/login/faculty" class="btn btn-outline-success btn-lg shadow-sm">👨‍🏫 Faculty Login Portal</a>
            <a href="/login/student" class="btn btn-outline-primary btn-lg shadow-sm">🎓 Student Login Portal</a>
        </div>
    </div>

</body>
</html>
