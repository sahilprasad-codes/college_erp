<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College ERP - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc; /* लाइट ग्रे-व्हाइट बैकग्राउंड */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(30, 41, 59, 0.05);
            padding: 2.5rem;
        }
        .main-heading {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1e3a8a; /* बोल्ड रॉयल ब्लू */
            letter-spacing: -0.5px;
        }
        .nav-pills {
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .nav-pills .nav-link {
            color: #475569;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        /* एक्टिव होने पर सॉलिड कॉर्पोरेट ब्लू */
        .nav-pills .nav-link.active-student { background: #1e40af; color: #fff !important; }
        .nav-pills .nav-link.active-faculty { background: #2563eb; color: #fff !important; }
        .nav-pills .nav-link.active-admin { background: #0f172a; color: #fff !important; }
        
        .form-control, .form-select {
            border: 2px solid #cbd5e1;
            font-weight: 600;
            color: #1e293b;
            border-radius: 10px;
            padding: 12px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-bold {
            background: #1e40af; /* गहरा रॉयल ब्लू बटन */
            color: white;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            padding: 14px;
            transition: background 0.2s;
        }
        .btn-bold:hover { background: #1d4ed8; color: white; }
        .link-blue { color: #2563eb; font-weight: 700; text-decoration: none; }
        .link-blue:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card">
                    <div class="text-center mb-4">
                        <span class="main-heading">🏫 EDULAND ERP</span>
                        <p class="text-muted small mt-1 fw-bold"> Indus University Ahmedabad </p>
                    </div>

                    <ul class="nav nav-pills nav-justified mb-4">
                        <li class="nav-item">
                            <a href="/login/student" class="nav-link {% if role == 'student' %}active-student{% endif %}">Student</a>
                        </li>
                        <li class="nav-item">
                            <a href="/login/faculty" class="nav-link {% if role == 'faculty' %}active-faculty{% endif %}">Faculty</a>
                        </li>
                        <li class="nav-item">
                            <a href="/login/admin" class="nav-link {% if role == 'admin' %}active-admin{% endif %}">Admin</a>
                        </li>
                    </ul>

                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            {% for msg in messages %}
                                <div class="alert alert-danger text-center py-2 small rounded-3 fw-bold mb-3">{{ msg }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="/login/{{ role }}">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">EMAIL ADDRESS</label>
                            <input type="email" name="email" class="form-control" placeholder="username@college.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">PASSWORD</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center small mb-4">
                            <a href="{{ url_for('forgot_password') }}" class="link-blue text-secondary">Forgot Password?</a>
                            {% if role != 'admin' %}
                                <a href="/signup/{{ role }}" class="link-blue">New Registration (Sign Up) →</a>
                            {% endif %}
                        </div>

                        <button type="submit" class="btn btn-bold w-100">LOG IN TO ERP 🚀</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
